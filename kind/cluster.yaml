# One-node kind cluster.
# Port 30080 → dev overlay (hello-dev, nodePort 30080)
# Port 30081 → prod overlay (hello-prod, nodePort 30081) — needed for exercise 05
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops-starter
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
