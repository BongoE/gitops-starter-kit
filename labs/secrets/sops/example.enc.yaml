# PLACEHOLDER — not real ciphertext.
# Run labs/secrets/sops/encrypt.sh to generate a real encrypted file.
# The output of `sops --encrypt` is safe to commit.
#
# What you will see here after running the script is a YAML file where every
# secret value is replaced with an age-encrypted ciphertext string, and a
# `sops:` metadata block is appended. The structure is still valid YAML and
# the non-secret fields (kind, metadata.name, etc.) remain in plaintext.
apiVersion: v1
kind: Secret
metadata:
    name: hello-secret
    namespace: hello-dev
type: Opaque
data:
    API_KEY: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER,type:str]
sops:
    age:
        - recipient: age1REPLACE_WITH_YOUR_PUBLIC_KEY
          enc: |
            -----BEGIN AGE ENCRYPTED FILE-----
            REPLACE_WITH_REAL_OUTPUT_FROM_encrypt.sh
            -----END AGE ENCRYPTED FILE-----
    lastmodified: "2026-10-25T00:00:00Z"
    version: 3.8.1
