# ExternalSecret: declares which secret to pull from the store and what
# Kubernetes Secret to produce. Argo CD syncs this manifest; ESO does the
# actual secret fetch at runtime — the plaintext never lives in Git.
#
# Replace /gitops-starter-kit/hello/api-key with your actual SSM parameter path.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hello-secret
  namespace: hello-dev
spec:
  refreshInterval: 1h          # how often ESO polls the store
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: hello-secret          # the Kubernetes Secret that will be created
    creationPolicy: Owner
  data:
    - secretKey: API_KEY        # key in the resulting Kubernetes Secret
      remoteRef:
        key: /gitops-starter-kit/hello/api-key   # REPLACE: your SSM parameter path
