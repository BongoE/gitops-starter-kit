# ClusterSecretStore: tells External Secrets Operator where to find secrets.
# This example uses AWS SSM Parameter Store. Swap 'aws' for 'gcpsm', 'azurekv',
# 'vault', etc. — the ExternalSecret below stays unchanged.
#
# Replace REGION and the secretRef values before applying.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1          # REPLACE: your AWS region
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-credentials
            namespace: external-secrets
            key: secret-access-key
