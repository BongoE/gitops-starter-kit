apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Installs the Sealed Secrets controller from its upstream release manifest.
# Pin the version by replacing 'latest' with a specific tag, e.g. v0.27.1
resources:
  - https://github.com/bitnami-labs/sealed-secrets/releases/latest/download/controller.yaml
