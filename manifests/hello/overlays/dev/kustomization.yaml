apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-dev
resources:
  - ../../base
  - namespace.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "Hello from DEV. Change me in Git and watch Argo CD sync."
    target:
      kind: Deployment
      name: hello
