apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hello-prod
resources:
  - ../../base
  - namespace.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "Hello from PROD. Two replicas. Same Git, different folder."
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "#2f6b3a"
    target:
      kind: Deployment
      name: hello
  - patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
    target:
      kind: Service
      name: hello
